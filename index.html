<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="睡眠打卡">
<meta name="theme-color" content="#c96442">
<title>🌙 睡眠打卡</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  @font-face {
    font-family: 'Lora';
    src: url('./fonts/Lora-Variable.woff2') format('woff2');
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/DMSans-Variable.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }
</style>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-base:       #f5f4f0;
    --bg-surface:    #faf9f6;
    --bg-card:       #ffffff;
    --bg-sidebar:    #ede9e3;

    --accent:        #c96442;
    --accent-hover:  #b5562f;
    --accent-muted:  #f0e6e0;
    --accent-soft:   rgba(201, 100, 66, 0.12);

    --gold:          #d4874a;
    --gold-soft:     #fef3e8;

    --text-primary:  #1c1917;
    --text-secondary:#78716c;
    --text-tertiary: #a8a29e;

    --border:        #e5e0d8;
    --border-strong: #d0c9be;

    --green:         #3b7c5e;
    --green-soft:    #e8f4ee;
    --yellow:        #b5830a;
    --yellow-soft:   #fef9e7;
    --red:           #c0392b;
    --red-soft:      #fdecea;

    --shadow-sm: 0 1px 3px rgba(28,25,23,0.06), 0 1px 2px rgba(28,25,23,0.04);
    --shadow-md: 0 4px 12px rgba(28,25,23,0.08), 0 2px 6px rgba(28,25,23,0.04);
    --shadow-lg: 0 8px 24px rgba(28,25,23,0.10), 0 4px 8px rgba(28,25,23,0.06);
    --radius: 14px;
    --radius-sm: 9px;
    --radius-pill: 100px;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 90px;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== TAB BAR ===== */
  .tab-bar {
    display: flex;
    position: fixed;
    bottom: env(safe-area-inset-bottom, 12px);
    left: 12px;
    right: 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(28,25,23,0.10), 0 1px 4px rgba(28,25,23,0.06);
    padding: 5px 0;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    background: none;
    border: none;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.18s, transform 0.15s;
  }

  .tab-btn.active { color: var(--accent); }

  .tab-btn:active { transform: scale(0.96); }

  .tab-btn .tab-icon {
    display: block;
    width: 27px;
    height: 27px;
  }

  .tab-page {
    display: none;
    padding: 24px 16px;
  }

  .tab-page.active { display: block; }

  /* ===== PAGE HEADER ===== */
  .page-header {
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .page-header h2 {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-action-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s;
  }

  .icon-action-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .icon-action-btn:active {
    transform: scale(0.96);
  }

  .icon-action-btn svg {
    width: 19px;
    height: 19px;
  }

  /* ===== CLOCK PAGE ===== */
  .clock-page {
    padding-top: 46px;
    text-align: center;
  }

  .current-time {
    font-family: 'Lora', serif;
    font-size: 56px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .current-ampm {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--text-secondary);
    margin-left: 4px;
    vertical-align: super;
  }

  .current-date {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 8px;
    margin-bottom: 48px;
  }

  /* ===== PUNCH BUTTON ===== */
  .punch-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin-bottom: 32px;
  }

  .punch-btn {
    width: 156px;
    height: 156px;
    border: none;
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    outline: none;
    border-radius: 50%;
    transition:
      transform 0.18s cubic-bezier(.34,1.56,.64,1),
      filter 0.18s,
      color 0.18s;
    -webkit-tap-highlight-color: transparent;
  }

  .punch-btn:hover {
    transform: scale(1.04);
  }

  .punch-btn:active {
    transform: scale(0.94);
  }

  .punch-icon {
    width: 118px;
    height: 118px;
    display: block;
    filter: drop-shadow(0 0 24px rgba(212, 135, 74, 0.36))
            drop-shadow(0 8px 28px rgba(212, 135, 74, 0.22));
    transition:
      filter 0.2s,
      transform 0.2s,
      color 0.2s;
  }

  .punch-btn.sleep-btn {
    color: var(--gold);
  }

  .punch-btn.sleep-btn::before {
    content: '';
    position: absolute;
    width: 142px;
    height: 142px;
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(254, 243, 232, 0.95) 0%, rgba(254, 243, 232, 0.55) 42%, rgba(254, 243, 232, 0) 70%);
    z-index: -1;
    animation: sunGlow 2.8s ease-in-out infinite;
  }

  .punch-btn.sleep-btn:hover .punch-icon {
    filter: drop-shadow(0 0 30px rgba(212, 135, 74, 0.5))
            drop-shadow(0 10px 34px rgba(212, 135, 74, 0.28));
  }

  .punch-btn.wake-btn {
    color: #f8e7b5;
  }

  .punch-btn.wake-btn::before {
    content: '';
    position: absolute;
    width: 146px;
    height: 146px;
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(248, 231, 181, 0.24) 0%, rgba(248, 231, 181, 0.12) 38%, rgba(248, 231, 181, 0) 72%);
    z-index: -1;
    animation: moonGlow 3.2s ease-in-out infinite;
  }

  .punch-btn.wake-btn .punch-icon {
    filter: drop-shadow(0 0 22px rgba(248, 231, 181, 0.34))
            drop-shadow(0 8px 28px rgba(0, 0, 0, 0.28));
  }

  @keyframes sunGlow {
    0%, 100% {
      transform: scale(1);
      opacity: 0.82;
    }
    50% {
      transform: scale(1.07);
      opacity: 1;
    }
  }

  @keyframes moonGlow {
    0%, 100% {
      transform: scale(1);
      opacity: 0.7;
    }
    50% {
      transform: scale(1.06);
      opacity: 1;
    }
  }

  /* ===== STATUS TEXT ===== */
  .status-card {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 320px;
    margin: 16px auto 0;
  }

  .status-card .time-highlight {
    color: var(--accent);
    font-weight: 600;
    font-size: 15px;
  }

  /* ===== QUICK ACTIONS ===== */
  .quick-adjust {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .sleep-action-row {
    max-width: 260px;
    margin-left: auto;
    margin-right: auto;
  }

  .sleep-action-row .adjust-btn {
    flex: 0 0 auto;
    min-width: 0;
    width: 118px;
    justify-content: center;
    text-align: center;
    padding-left: 10px;
    padding-right: 10px;
  }

  .adjust-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: var(--shadow-sm);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .adjust-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  .adjust-btn:active { transform: scale(0.97); }

  .sleep-only-actions {
    display: none;
  }

  body.is-sleeping .sleep-only-actions {
    display: inline-flex;
  }

  /* ===== SLEEPING DARK MODE ===== */
  body.is-sleeping {
    background:
      radial-gradient(circle at 50% 8%, rgba(248, 231, 181, 0.11), transparent 34%),
      linear-gradient(180deg, #151821 0%, #0f1219 52%, #0b0d12 100%);
    color: #f8e7b5;
  }

  body.is-sleeping .clock-page {
    color: #f8e7b5;
  }

  body.is-sleeping .current-time,
  body.is-sleeping .page-header h2 {
    color: #f8e7b5;
  }

  body.is-sleeping .current-ampm,
  body.is-sleeping .current-date {
    color: rgba(248, 231, 181, 0.68);
  }

  body.is-sleeping .status-card {
    background: transparent;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
    color: rgba(248, 231, 181, 0.76);
  }

  body.is-sleeping .status-card .time-highlight {
    color: #f8e7b5;
  }

  body.is-sleeping .adjust-btn {
    background: rgba(248, 231, 181, 0.08);
    border-color: rgba(248, 231, 181, 0.16);
    color: rgba(248, 231, 181, 0.78);
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }

  body.is-sleeping .adjust-btn:hover {
    background: rgba(248, 231, 181, 0.14);
    border-color: rgba(248, 231, 181, 0.32);
    color: #f8e7b5;
  }

  body.is-sleeping .tab-bar {
    background: rgba(20, 23, 32, 0.88);
    border-color: rgba(248, 231, 181, 0.12);
    box-shadow: 0 8px 28px rgba(0,0,0,0.34);
    backdrop-filter: blur(14px);
  }

  body.is-sleeping .tab-btn {
    color: rgba(248, 231, 181, 0.38);
  }

  body.is-sleeping .tab-btn.active {
    color: #f8e7b5;
  }

  body.is-sleeping .offline-banner {
    background: #7c5c1e;
  }

  body.is-sleeping .stat-card {
    background: rgba(248, 231, 181, 0.06);
    border-color: rgba(248, 231, 181, 0.14);
    color: #f8e7b5;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }

  body.is-sleeping .stat-card.active {
    background: rgba(248, 231, 181, 0.12);
    border-color: rgba(248, 231, 181, 0.32);
  }

  body.is-sleeping .stat-label {
    color: rgba(248, 231, 181, 0.58);
  }

  body.is-sleeping .chart-container {
    background: rgba(20, 23, 32, 0.84);
    border-color: rgba(248, 231, 181, 0.12);
    box-shadow: 0 8px 24px rgba(0,0,0,0.30);
  }

  body.is-sleeping .chart-title {
    color: rgba(248, 231, 181, 0.62);
  }

  body.is-sleeping .fixed-y-axis {
    color: rgba(248, 231, 181, 0.58);
  }

  /* ===== RECORDS ===== */
  .record-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    box-shadow: var(--shadow-sm);
  }

  .record-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .record-card:active { transform: scale(0.99); }

  .record-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .record-date {
    font-size: 12px;
    color: var(--text-tertiary);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .record-times {
    display: flex;
    gap: 14px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .record-times span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .record-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .record-duration {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
  }

  .record-edit-icon {
    font-size: 14px;
    color: var(--text-tertiary);
    opacity: 0.6;
  }

  .duration-good { color: var(--green); }
  .duration-warn { color: var(--yellow); }
  .duration-bad  { color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 56px 24px;
    color: var(--text-tertiary);
  }

  .empty-state .empty-icon {
    font-size: 40px;
    margin-bottom: 14px;
    opacity: 0.6;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
  }

  /* ===== STATS ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }

  .stat-card {
    appearance: none;
    width: 100%;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 15px 12px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: all 0.15s;
  }

  .stat-card:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }

  .stat-card:active {
    transform: scale(0.98);
  }

  .stat-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 6px 18px rgba(201,100,66,0.12);
  }

  .stat-value {
    font-family: 'Lora', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .chart-section {
    display: none;
  }

  .chart-section.active {
    display: block;
  }

  .chart-container {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  .chart-title {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .chart-area {
    position: relative;
    width: 100%;
    height: 260px;
  }

  .chart-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }

  .fixed-y-axis {
    width: 58px;
    flex: 0 0 58px;
    height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px 4px 18px 0;
    text-align: right;
    font-size: 11px;
    color: var(--text-tertiary);
    user-select: none;
    pointer-events: none;
  }

  .fixed-y-axis .axis-item {
    line-height: 1;
  }

  .chart-scroll {
    flex: 1;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
  }

  .chart-viewport {
    position: relative;
    height: 260px;
  }

  .chart-viewport canvas {
    display: block;
  }

  .chart-area canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  .chart-empty {
    margin-bottom: 16px;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(28,25,23,0.4);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--bg-surface);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.6) inset;
    animation: modalIn 0.22s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal h3 {
    font-family: 'Lora', serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 22px;
    text-align: center;
    color: var(--text-primary);
  }

  .modal label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }

  .modal input[type="datetime-local"] {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    margin-bottom: 18px;
    outline: none;
    transition: border-color 0.15s;
    box-shadow: var(--shadow-sm) inset;
  }

  .modal input[type="datetime-local"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-cancel {
    background: var(--bg-base);
    color: var(--text-secondary);
  }

  .btn-cancel:hover { border-color: var(--border-strong); }

  .btn-confirm {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(201,100,66,0.25);
  }

  .btn-confirm:hover { background: var(--accent-hover); }

  .btn-danger {
    background: var(--red-soft);
    color: var(--red);
    border-color: transparent;
  }

  .btn-danger:hover { background: #f9d5d3; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-primary);
    color: var(--bg-surface);
    padding: 10px 20px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    box-shadow: var(--shadow-lg);
    white-space: nowrap;
    animation: toastIn 0.2s ease;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-6px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ===== OFFLINE BANNER ===== */
  .offline-banner {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: var(--yellow);
    color: white;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 16px;
    z-index: 998;
    letter-spacing: 0.04em;
  }

  body.offline .offline-banner { display: block; }
  body.offline { padding-top: 28px; }

  /* ===== INSTALL PROMPT ===== */
  .install-banner {
    display: none;
    position: fixed;
    bottom: 80px;
    left: 16px;
    right: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-lg);
    z-index: 300;
    align-items: center;
    gap: 12px;
    animation: toastIn 0.22s ease;
  }

<body>

    <div class="modal-btns" id="modalBtns">

      <button class="btn-confirm" onclick="saveManualRecord()">保存</button>
    </div>

<script>
// ==================== 数据管理 ====================
const STORAGE_KEY = 'sleep_tracker_data';
const STATE_KEY = 'sleep_tracker_state';
const CHART_MODE_KEY = 'sleep_tracker_chart_mode';

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)) || {}; }
  catch { return {}; }
}

function saveState(state) {
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function loadChartMode() {
  return localStorage.getItem(CHART_MODE_KEY) || 'duration';
}

function saveChartMode(mode) {
  localStorage.setItem(CHART_MODE_KEY, mode);
}

// ==================== 时间工具 ====================
function getSleepDate(sleepTimeStr) {
  const d = new Date(sleepTimeStr);
  if (d.getHours() < 18) { d.setDate(d.getDate() - 1); }
  d.setHours(0, 0, 0, 0);
  return d;
}

function toAmPm(date) {
  const d = new Date(date);
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function hourToAmPm(decimalHour) {
  let totalMinutes = Math.round((((decimalHour % 24) + 24) % 24) * 60);
  if (totalMinutes >= 24 * 60) totalMinutes -= 24 * 60;
  let h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
}

function hourLabel(decimalHour) {
  return hourToAmPm(decimalHour).replace(':00 ', ' ');
}

function fmtDate(d) { return `${d.getMonth()+1}月${d.getDate()}日`; }
function fmtDateShort(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function weekdayStr(d) { return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }

function toLocalISO(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function calcDuration(sleep, wake) {
  return (new Date(wake) - new Date(sleep)) / 3600000;
}

function durationText(hours) {
  const totalMinutes = Math.max(0, Math.round(hours * 60));
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

function durationClass(hours) {
  if (hours >= 7 && hours <= 9) return 'duration-good';
  if (hours >= 6 && hours <= 10) return 'duration-warn';
  return 'duration-bad';
}

function getClockHour(dateStr) {
  const d = new Date(dateStr);
  return d.getHours() + d.getMinutes() / 60;
}

function getSleepAxisHour(dateStr) {
  let h = getClockHour(dateStr);
  if (h < 18) h += 24;
  return h;
}

function durationBarColor(hours) {
  return hours >= 7.5 ? 'rgba(59,124,94,0.80)' : 'rgba(212,135,74,0.86)';
}

function sleepTimeColorFromAxisHour(axisHour) {
  if (axisHour < 23) return 'rgba(59,124,94,0.90)';     // 早于 11PM
  if (axisHour < 24) return 'rgba(181,131,10,0.92)';    // 11PM ~ 12AM
  return 'rgba(212,135,74,0.92)';                       // 晚于 12AM
}

function sleepTimeColorFromDate(dateStr) {
  return sleepTimeColorFromAxisHour(getSleepAxisHour(dateStr));
}

function clearChart(chart) {
  if (chart) chart.destroy();
  return null;
}

function refreshChartsIfVisible() {
  if (document.getElementById('page-chart').classList.contains('active')) {
    renderCharts();
  }
}

function showSectionCharts(sectionKey) {
  const charts = document.getElementById(sectionKey + 'Charts');
  const empty = document.getElementById(sectionKey + 'Empty');
  if (charts) charts.style.display = 'block';
  if (empty) empty.style.display = 'none';
}

function showSectionEmpty(sectionKey, html) {
  const charts = document.getElementById(sectionKey + 'Charts');
  const empty = document.getElementById(sectionKey + 'Empty');
  if (charts) charts.style.display = 'none';
  if (empty) {
    if (html) empty.innerHTML = html;
    empty.style.display = 'block';
  }
}

function destroyAllCharts() {
  weeklyChart = clearChart(weeklyChart);
  ganttChart = clearChart(ganttChart);
  weeklySleepChart = clearChart(weeklySleepChart);
  dailySleepChart = clearChart(dailySleepChart);
}

function applyChartMode() {
  const mode = loadChartMode();
  const durationSection = document.getElementById('durationSection');
  const sleepTimeSection = document.getElementById('sleepTimeSection');

  if (durationSection) durationSection.classList.toggle('active', mode === 'duration');
  if (sleepTimeSection) sleepTimeSection.classList.toggle('active', mode === 'sleepTime');

  document.querySelectorAll('.stat-card[data-mode]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
}

function setChartMode(mode) {
  if (mode !== 'duration' && mode !== 'sleepTime') return;
  saveChartMode(mode);
  applyChartMode();
  if (document.getElementById('page-chart').classList.contains('active')) {
    renderCharts();
  }
}

function getScrollableCanvasWidth(scrollEl, count, slotWidth = 30, minHeight = 260) {
  const baseWidth = scrollEl ? Math.floor(scrollEl.clientWidth || scrollEl.getBoundingClientRect().width || 0) : 0;
  return Math.max(baseWidth, Math.max(count, 1) * slotWidth, 280, minHeight);
}

function setupScrollableCanvas(viewportId, canvasId, count, slotWidth = 30, height = 260) {
  const viewport = document.getElementById(viewportId);
  const canvas = document.getElementById(canvasId);
  if (!viewport || !canvas) return null;

  const scrollEl = viewport.parentElement;
  const width = getScrollableCanvasWidth(scrollEl, count, slotWidth, height);

  viewport.style.width = width + 'px';
  canvas.width = width;
  canvas.height = height;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  return canvas;
}

function renderFixedYAxis(containerId, labels) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = labels.map(t => `<div class="axis-item">${t}</div>`).join('');
}

function scrollChartToEnd(scrollContainerId) {
  const el = document.getElementById(scrollContainerId);
  if (!el) return;
  requestAnimationFrame(() => {
    el.scrollLeft = Math.max(0, el.scrollWidth - el.clientWidth);
  });
}

// ==================== 时钟 ====================
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');

  document.getElementById('currentTime').innerHTML =
    `${h}:${m}:${s}<span class="current-ampm">${ampm}</span>`;

  document.getElementById('currentDate').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdayStr(now)}`;
}

setInterval(updateClock, 1000);
updateClock();

// ==================== 打卡逻辑 ====================
function updatePunchUI() {
  const state = loadState();
  const btn = document.getElementById('punchBtn');
  const statusEl = document.getElementById('statusText');

  document.body.classList.toggle('is-sleeping', !!state.sleeping);

  if (state.sleeping) {
    btn.className = 'punch-btn wake-btn';
    btn.setAttribute('aria-label', '醒来打卡');
    btn.innerHTML = `
      <svg class="punch-icon moon-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M20.2 14.4A8.2 8.2 0 0 1 9.6 3.8a8.8 8.8 0 1 0 10.6 10.6Z"
          fill="currentColor"/>
        <path
          d="M17.6 4.2l.35.9.9.35-.9.35-.35.9-.35-.9-.9-.35.9-.35.35-.9ZM19.7 8.2l.24.62.62.24-.62.24-.24.62-.24-.62-.62-.24.62-.24.24-.62Z"
          fill="currentColor"
          opacity="0.9"/>
      </svg>`;

    const sd = getSleepDate(state.sleepTime);
    statusEl.innerHTML = `已在 <span class="time-highlight">${fmtDate(sd)} ${toAmPm(state.sleepTime)}</span> 入睡<br>正在睡眠中…`;
  } else {
    btn.className = 'punch-btn sleep-btn';
    btn.setAttribute('aria-label', '入睡打卡');
    btn.innerHTML = `
      <svg class="punch-icon sun-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
        <path
          d="M12 2.5v2.2M12 19.3v2.2M4.57 4.57l1.56 1.56M17.87 17.87l1.56 1.56M2.5 12h2.2M19.3 12h2.2M4.57 19.43l1.56-1.56M17.87 6.13l1.56-1.56"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"/>
      </svg>`;

    const records = loadRecords();
    if (records.length > 0) {
      const last = records[records.length - 1];
      const dur = calcDuration(last.sleep, last.wake);
      statusEl.innerHTML = `上次睡眠 <span class="time-highlight">${durationText(dur)}</span><br>${toAmPm(last.sleep)} → ${toAmPm(last.wake)}`;
    } else {
      statusEl.innerHTML = '今晚还没有打卡哦，准备睡觉时点击按钮 🌙';
    }
  }
}

function handlePunch() {
  const state = loadState();
  const now = new Date().toISOString();

  if (!state.sleeping) {
    saveState({ sleeping: true, sleepTime: now });
    showToast('🌙 晚安，好梦！');
  } else {
    const records = loadRecords();
    records.push({ id: Date.now(), sleep: state.sleepTime, wake: now });
    saveRecords(records);
    saveState({ sleeping: false });
    showToast('☀️ 早安！记录已保存');
  }

  updatePunchUI();
}

function cancelSleep() {
  const state = loadState();
  if (!state.sleeping) return showToast('当前没有入睡记录');
  saveState({ sleeping: false });
  updatePunchUI();
  showToast('已取消入睡');
}

function restartSleep() {
  const state = loadState();
  if (!state.sleeping) return showToast('当前没有入睡记录');
  saveState({ sleeping: true, sleepTime: new Date().toISOString() });
  updatePunchUI();
  showToast('已重新记录入睡时间');
}

// ==================== 弹窗 ====================
let editingRecordId = null;

function openManualModal() {
  editingRecordId = null;
  document.getElementById('modalTitle').textContent = '手动记录睡眠';

  const now = new Date();

  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  yesterday.setHours(23, 0, 0, 0);

  const morning = new Date(now);
  morning.setHours(7, 30, 0, 0);

  document.getElementById('manualSleep').value = toLocalISO(yesterday);
  document.getElementById('manualWake').value = toLocalISO(morning);

  document.getElementById('modalBtns').innerHTML = `
    <button class="btn-cancel" onclick="closeManualModal()">取消</button>
    <button class="btn-confirm" onclick="saveManualRecord()">保存</button>`;

  document.getElementById('manualModal').classList.add('show');
}

function openEditModal(id) {
  editingRecordId = id;

  const records = loadRecords();
  const rec = records.find(r => r.id === id);
  if (!rec) return;

  document.getElementById('modalTitle').textContent = '编辑睡眠记录';
  document.getElementById('manualSleep').value = toLocalISO(new Date(rec.sleep));
  document.getElementById('manualWake').value = toLocalISO(new Date(rec.wake));

  document.getElementById('modalBtns').innerHTML = `
    <button class="btn-cancel" onclick="closeManualModal()">取消</button>
    <button class="btn-danger" onclick="deleteRecord(${id})">删除</button>
    <button class="btn-confirm" onclick="saveManualRecord()">保存</button>`;

  document.getElementById('manualModal').classList.add('show');
}

function closeManualModal() {
  document.getElementById('manualModal').classList.remove('show');
  editingRecordId = null;
}

function saveManualRecord() {
  const sleepVal = document.getElementById('manualSleep').value;
  const wakeVal = document.getElementById('manualWake').value;

  if (!sleepVal || !wakeVal) return showToast('请填写完整时间');

  const sleepTime = new Date(sleepVal).toISOString();
  const wakeTime = new Date(wakeVal).toISOString();
  const duration = calcDuration(sleepTime, wakeTime);

  if (duration <= 0) return showToast('醒来时间需晚于入睡时间');
  if (duration > 24) return showToast('睡眠时间不能超过24小时');

  const records = loadRecords();
  const isEdit = editingRecordId !== null;

  if (isEdit) {
    const idx = records.findIndex(r => r.id === editingRecordId);
    if (idx !== -1) {
      records[idx].sleep = sleepTime;
      records[idx].wake = wakeTime;
    }
  } else {
    records.push({ id: Date.now(), sleep: sleepTime, wake: wakeTime });
  }

  records.sort((a, b) => new Date(a.sleep) - new Date(b.sleep));
  saveRecords(records);

  closeManualModal();
  showToast(isEdit ? '✓ 记录已更新' : '✓ 记录已保存');

  editingRecordId = null;
  renderHistory();
  updatePunchUI();
  refreshChartsIfVisible();
}

function deleteRecord(id) {
  if (!confirm('确定删除这条记录吗？')) return;

  const records = loadRecords().filter(r => r.id !== id);
  saveRecords(records);

  closeManualModal();
  renderHistory();
  updatePunchUI();
  refreshChartsIfVisible();
  showToast('已删除');
}

// ==================== 导出 / 导入 ====================
function exportData() {
  const records = localStorage.getItem(STORAGE_KEY) || '[]';
  const blob = new Blob([records], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = `sleep-data-${new Date().toISOString().slice(0, 10)}.json`;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast('数据已导出');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';

  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = evt => {
      try {
        const data = JSON.parse(evt.target.result);

        if (Array.isArray(data)) {
          const existing = loadRecords();
          const existingIds = new Set(existing.map(r => r.id));
          let added = 0;

          data.forEach(r => {
            if (r.sleep && r.wake && !existingIds.has(r.id)) {
              existing.push({
                id: r.id || Date.now() + Math.random(),
                sleep: r.sleep,
                wake: r.wake
              });
              added++;
            }
          });

          existing.sort((a, b) => new Date(a.sleep) - new Date(b.sleep));
          saveRecords(existing);

          showToast(`导入成功，新增 ${added} 条记录`);
          renderHistory();
          updatePunchUI();
          refreshChartsIfVisible();
        } else {
          showToast('文件格式错误');
        }
      } catch {
        showToast('文件解析失败');
      }
    };

    reader.readAsText(file);
  };

  input.click();
}

// ==================== 图表：按需加载 Chart.js ====================
let weeklyChart = null;
let ganttChart = null;
let weeklySleepChart = null;
let dailySleepChart = null;
let chartJsLoadingPromise = null;
let chartRenderToken = 0;

function loadChartJS() {
  if (window.Chart) return Promise.resolve();
  if (chartJsLoadingPromise) return chartJsLoadingPromise;

  chartJsLoadingPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0';
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Chart.js 加载失败'));
    document.head.appendChild(script);
  });

  return chartJsLoadingPromise;
}

function getWeekMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d);
  mon.setDate(diff);
  mon.setHours(0, 0, 0, 0);
  return mon;
}

function renderStatsButtons(records) {
  const statsGrid = document.getElementById('statsGrid');
  const mode = loadChartMode();

  if (!statsGrid) return;

  if (!records || records.length === 0) {
    statsGrid.innerHTML = `
      <button class="stat-card ${mode === 'duration' ? 'active' : ''}" type="button" onclick="setChartMode('duration')" data-mode="duration">
        <div class="stat-value">--</div>
        <div class="stat-label">平均睡眠时长</div>
      </button>
      <button class="stat-card ${mode === 'sleepTime' ? 'active' : ''}" type="button" onclick="setChartMode('sleepTime')" data-mode="sleepTime">
        <div class="stat-value" style="font-size:20px">--</div>
        <div class="stat-label">平均入睡时间</div>
      </button>`;
    return;
  }

  const allDurations = records.map(r => calcDuration(r.sleep, r.wake));
  const avgDur = allDurations.reduce((a, b) => a + b, 0) / allDurations.length;
  const avgSleepHour = records.reduce((sum, r) => sum + getSleepAxisHour(r.sleep), 0) / records.length;

  statsGrid.innerHTML = `
    <button class="stat-card ${mode === 'duration' ? 'active' : ''}" type="button" onclick="setChartMode('duration')" data-mode="duration">
      <div class="stat-value ${durationClass(avgDur)}">${durationText(avgDur)}</div>
      <div class="stat-label">平均睡眠时长</div>
    </button>
    <button class="stat-card ${mode === 'sleepTime' ? 'active' : ''}" type="button" onclick="setChartMode('sleepTime')" data-mode="sleepTime">
      <div class="stat-value" style="font-size:20px">${hourToAmPm(avgSleepHour)}</div>
      <div class="stat-label">平均入睡时间</div>
    </button>`;
}

function renderDurationCharts(records) {
  weeklyChart = clearChart(weeklyChart);
  ganttChart = clearChart(ganttChart);
  weeklySleepChart = clearChart(weeklySleepChart);
  dailySleepChart = clearChart(dailySleepChart);

  showSectionCharts('duration');

  const chartFontColor = document.body.classList.contains('is-sleeping')
    ? 'rgba(248, 231, 181, 0.72)'
    : '#78716c';
  const gridColor = document.body.classList.contains('is-sleeping')
    ? 'rgba(248, 231, 181, 0.10)'
    : 'rgba(120,113,108,0.12)';

  // 每周平均睡眠时长
  const weekMap = new Map();
  records.forEach(r => {
    const sd = getSleepDate(r.sleep);
    const mon = getWeekMonday(sd);
    const key = mon.getTime();

    if (!weekMap.has(key)) weekMap.set(key, { mon, durations: [] });
    weekMap.get(key).durations.push(calcDuration(r.sleep, r.wake));
  });

  const weeks = Array.from(weekMap.values())
    .sort((a, b) => a.mon - b.mon)
    .slice(-12);

  const weekLabels = weeks.map(w => fmtDateShort(w.mon));
  const weekAvgs = weeks.map(w =>
    Math.round((w.durations.reduce((a, b) => a + b, 0) / w.durations.length) * 100) / 100
  );

  weeklyChart = new Chart(document.getElementById('weeklyChart'), {
    type: 'bar',
    data: {
      labels: weekLabels,
      datasets: [{
        data: weekAvgs,
        backgroundColor: weekAvgs.map(d => durationBarColor(d)),
        borderRadius: 6,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `平均 ${durationText(ctx.raw)}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: chartFontColor, font: { size: 10 } },
          grid: { display: false }
        },
        y: {
          min: 0,
          max: 10,
          ticks: { color: chartFontColor, stepSize: 2 },
          grid: { color: gridColor }
        }
      }
    }
  });

  // 每日睡眠时间甘特图
  renderFixedYAxis('ganttAxis', [
    '10 PM', '11 PM', '12 AM', '1 AM', '2 AM', '3 AM',
    '4 AM', '5 AM', '6 AM', '7 AM', '8 AM', '9 AM', '10 AM'
  ]);

  // 最近日期靠右：旧 -> 新
  const ganttRecords = records.slice().sort((a, b) => new Date(a.sleep) - new Date(b.sleep));
  const ganttLabels = ganttRecords.map(r => fmtDateShort(getSleepDate(r.sleep)));

  const ganttData = ganttRecords.map(r => {
    const sh = getSleepAxisHour(r.sleep);
    let wh = getSleepAxisHour(r.wake);
    if (wh <= sh) wh += 24;
    return [sh, wh];
  });

  const ganttCanvas = setupScrollableCanvas('ganttViewport', 'ganttChart', ganttRecords.length, 30, 260);
  if (!ganttCanvas) return;

  ganttChart = new Chart(ganttCanvas, {
    type: 'bar',
    data: {
      labels: ganttLabels,
      datasets: [{
        data: ganttData,
        backgroundColor: ganttData.map(d => durationBarColor(d[1] - d[0])),
        borderRadius: 4,
        borderSkipped: false,
        barPercentage: 0.55,
        categoryPercentage: 0.8
      }]
    },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => ganttLabels[items[0].dataIndex],
            label: ctx => {
              const [s, w] = ctx.raw;
              return `🌙 ${hourToAmPm(s)} → ☀️ ${hourToAmPm(w)}  （${durationText(w - s)}）`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: chartFontColor,
            font: { size: 10 },
            maxRotation: 45,
            minRotation: 30
          },
          grid: { display: false }
        },
        y: {
          reverse: true,
          min: 22,
          max: 34,
          ticks: {
            display: false
          },
          grid: { color: gridColor }
        }
      }
    }
  });

  scrollChartToEnd('ganttViewport');
}

function renderSleepTimeCharts(records) {
  weeklyChart = clearChart(weeklyChart);
  ganttChart = clearChart(ganttChart);
  weeklySleepChart = clearChart(weeklySleepChart);
  dailySleepChart = clearChart(dailySleepChart);

  showSectionCharts('sleepTime');

  const chartFontColor = document.body.classList.contains('is-sleeping')
    ? 'rgba(248, 231, 181, 0.72)'
    : '#78716c';
  const gridColor = document.body.classList.contains('is-sleeping')
    ? 'rgba(248, 231, 181, 0.10)'
    : 'rgba(120,113,108,0.12)';

  // 每周平均入睡时间
  const weekMap = new Map();
  records.forEach(r => {
    const sd = getSleepDate(r.sleep);
    const mon = getWeekMonday(sd);
    const key = mon.getTime();

    if (!weekMap.has(key)) weekMap.set(key, { mon, values: [] });
    weekMap.get(key).values.push(getSleepAxisHour(r.sleep));
  });

  const weeks = Array.from(weekMap.values())
    .sort((a, b) => a.mon - b.mon)
    .slice(-12);

  const weekLabels = weeks.map(w => fmtDateShort(w.mon));
  const weekValues = weeks.map(w =>
    Math.round((w.values.reduce((a, b) => a + b, 0) / w.values.length) * 100) / 100
  );
  const weekColors = weekValues.map(v => sleepTimeColorFromAxisHour(v));

  weeklySleepChart = new Chart(document.getElementById('weeklySleepChart'), {
    type: 'line',
    data: {
      labels: weekLabels,
      datasets: [{
        data: weekValues,
        showLine: false,
        pointRadius: 5,
        pointHoverRadius: 7,
        pointBorderWidth: 2,
        pointBackgroundColor: weekColors,
        pointBorderColor: weekColors,
        borderColor: 'transparent',
        tension: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `平均入睡 ${hourToAmPm(ctx.raw)}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: chartFontColor, font: { size: 10 } },
          grid: { display: false }
        },
        y: {
          reverse: true,
          min: 21,
          max: 28,
          ticks: {
            color: chartFontColor,
            stepSize: 1,
            callback: v => hourLabel(v)
          },
          grid: { color: gridColor }
        }
      }
    }
  });

  // 每日入睡时间
  renderFixedYAxis('dailySleepAxis', ['9 PM', '10 PM', '11 PM', '12 AM', '1 AM', '2 AM', '3 AM', '4 AM']);

  // 最近日期靠右：旧 -> 新
  const dailyRecords = records.slice().sort((a, b) => new Date(a.sleep) - new Date(b.sleep));
  const dailyLabels = dailyRecords.map(r => fmtDateShort(getSleepDate(r.sleep)));
  const dailyValues = dailyRecords.map(r => getSleepAxisHour(r.sleep));
  const dailyColors = dailyRecords.map(r => sleepTimeColorFromDate(r.sleep));

  const dailyCanvas = setupScrollableCanvas('dailySleepViewport', 'dailySleepChart', dailyRecords.length, 30, 260);
  if (!dailyCanvas) return;

  dailySleepChart = new Chart(dailyCanvas, {
    type: 'line',
    data: {
      labels: dailyLabels,
      datasets: [{
        data: dailyValues,
        showLine: false,
        pointRadius: 5,
        pointHoverRadius: 7,
        pointBorderWidth: 2,
        pointBackgroundColor: dailyColors,
        pointBorderColor: dailyColors,
        borderColor: 'transparent',
        tension: 0
      }]
    },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => dailyLabels[items[0].dataIndex],
            label: ctx => `入睡 ${hourToAmPm(ctx.raw)}`
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: chartFontColor,
            font: { size: 10 },
            maxRotation: 45,
            minRotation: 30
          },
          grid: { display: false }
        },
        y: {
          reverse: true,
          min: 21,
          max: 28,
          ticks: {
            display: false
          },
          grid: { color: gridColor }
        }
      }
    }
  });

  scrollChartToEnd('dailySleepViewport');
}

function renderCharts() {
  const statsGrid = document.getElementById('statsGrid');
  const currentMode = loadChartMode();
  const token = ++chartRenderToken;

  if (statsGrid) {
    statsGrid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">📊</div>
        <p>正在加载图表…</p>
      </div>`;
  }

  const records = loadRecords();
  renderStatsButtons(records);
  applyChartMode();

  if (!records || records.length === 0) {
    destroyAllCharts();
    showSectionEmpty(currentMode, currentMode === 'duration'
      ? '<div class="empty-icon">📊</div><p>记录数据后<br>这里会显示统计图表</p>'
      : '<div class="empty-icon">🌙</div><p>记录数据后<br>这里会显示平均入睡时间图表</p>');
    return;
  }

  loadChartJS()
    .then(() => {
      if (token !== chartRenderToken) return;
      if (loadChartMode() !== currentMode) return;

      destroyAllCharts();

      if (currentMode === 'duration') {
        renderDurationCharts(records);
      } else {
        renderSleepTimeCharts(records);
      }
    })
    .catch(() => {
      if (statsGrid) {
        statsGrid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="empty-icon">⚠️</div>
            <p>统计图表加载失败</p>
          </div>`;
      }
      showToast('统计图表加载失败');
    });
}

// ==================== 页面切换 ====================
function switchTab(name, el) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');

  if (name === 'history') renderHistory();
  if (name === 'chart') renderCharts();
}

// ==================== Toast ====================
function showToast(msg) {
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = msg;

  document.body.appendChild(div);

  setTimeout(() => {
    div.style.opacity = '0';
    div.style.transition = 'opacity 0.3s';
  }, 1800);

  setTimeout(() => div.remove(), 2200);
}

// ==================== 初始化 ====================
updatePunchUI();
applyChartMode();

// ==================== PWA：Service Worker 注册 ====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered, scope:', reg.scope))
      .catch(err => console.warn('SW registration failed:', err));
  });
}

// ==================== PWA：离线状态检测 ====================
function updateOnlineStatus() {
  document.body.classList.toggle('offline', !navigator.onLine);
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ==================== PWA：安装提示 ====================
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;

  if (!localStorage.getItem('pwa_install_dismissed')) {
    setTimeout(() => {
      document.getElementById('installBanner').classList.add('show');
    }, 2000);
  }
});

function doInstall() {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  deferredPrompt.userChoice.then(choice => {
    deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('show');

    if (choice.outcome === 'accepted') {
      showToast('已添加到主屏幕！');
    }
  });
}

function dismissInstall() {
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('pwa_install_dismissed', '1');
}

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});
</script>
